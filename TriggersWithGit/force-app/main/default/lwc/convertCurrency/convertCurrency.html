<template>
    <lightning-card title="Currency Conversion">
        <div class="fileformat slds-var-p-around-small">
         <lightning-input label="Amount" onchange={changeHandler} name="Amount">
            
         </lightning-input>
        </div>
        <div class="fileformat slds-var-p-around-small">
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                    <lightning-combobox
                    name="fromcurr"
                    label="From Currency"
                    options={CurrencyOptions}
                    onchange={changeHandler} ></lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-combobox
                    name="tocurr" 
                    label="To Currency"
                    options={CurrencyOptions}
                    onchange={changeHandler} ></lightning-combobox>
                </div>
              </div>
        </div>
        <div class="fileformat slds-var-p-around-small">
           <lightning-button label="Convert" 
           onclick={clickHandler}>
        </lightning-button>
        </div>
        <template lwc:if={showOutput}>
            <div class="fileformat slds-var-p-around-small">
                <p>Converted Value:</p>
            
                <p><lightning-formatted-number 
                    value={ConvertedValue}
                    format-style="currency"
                    currency-code={toCurrency}
                    currency-display-as="name">
                    </lightning-formatted-number></p>
       
            </div>
        </template>   
    </lightning-card>
    
</template>
